<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>比比看 Compara y Adivina</title>
<style>
:root{--acc:#ff7a59;--acc2:#ffe8e0;--ink:#222;--mut:#777;--ok:#2e9d5b;--bad:#e0464b;--bg:#fff;--panel:#f6f6f7}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
#app{position:relative;max-width:520px;margin:0 auto;padding:14px 16px 40px}
h1{text-align:center;margin:10px 0 0;font-size:2rem;letter-spacing:.1em}
.sub{text-align:center;color:var(--mut);margin-bottom:14px}
small{display:block;font-size:.72em;color:var(--mut);font-weight:400;line-height:1.2}
.panel{background:var(--panel);border-radius:14px;padding:12px 14px;margin:10px 0}
.panel h3{margin:0 0 8px;font-size:1rem}
.note{color:var(--mut);font-size:.85rem;text-align:center}
.ver{text-align:center;color:#bbb;font-size:.75rem;margin-top:18px}
/* 統一按鈕（三款遊戲同一規格）：膠囊形；選項按鈕高 46px、主要按鈕滿寬（最寬 300px）高 54px */
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts.two .opt{flex:1 1 40%}
.opt{flex:1 1 0;min-width:0;min-height:46px;border:2px solid #ddd;background:#fff;border-radius:999px;padding:5px 10px;font-size:1rem;cursor:pointer;text-align:center;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;font-family:inherit}
.opt.on{border-color:var(--acc);background:var(--acc2);font-weight:700}
.big{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:300px;min-height:54px;margin:10px auto;border:0;border-radius:999px;padding:6px 18px;font-size:1.15rem;background:var(--acc);color:#fff;cursor:pointer;font-weight:700;line-height:1.2;text-decoration:none;font-family:inherit}
.big.sec{background:#eee;color:var(--ink)}
.big small{color:inherit;opacity:.8}
.lvl{display:block;width:100%;min-height:54px;text-align:center;border:2px solid #eee;background:#fff;border-radius:999px;padding:9px 26px;margin:8px 0;cursor:pointer;font-size:1.05rem;color:var(--ink);line-height:1.3;font-family:inherit}
.lvl b{color:var(--acc);margin-right:6px}
.lvl small{display:inline;margin-left:6px}
.lvl .d{font-size:.8rem;color:var(--mut);margin-top:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.95rem}
.top .grow{flex:1}
.pillx{border:1.5px solid #ddd;background:#fff;border-radius:999px;min-width:42px;height:42px;padding:0 12px;cursor:pointer;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);font-family:inherit}
.gear{position:absolute;top:10px;right:12px;width:42px;height:42px;border-radius:999px;border:1.5px solid #ddd;background:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;z-index:2}
.top .gear{position:static;flex:0 0 42px}
.bar{height:6px;background:#eee;border-radius:3px;margin:8px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.q{font-size:1.35rem;line-height:1.9;margin:12px 0 6px;text-align:center}
.nm{color:#2a5bd7;font-weight:700;margin:0 .15em}
.blank{display:inline-block;min-width:2.6em;border-bottom:3px solid var(--acc);margin:0 .2em;color:var(--acc);font-weight:700}
.q .ask{display:block;font-weight:700;margin-top:4px}
/* 拼音／注音：放在每個詞的上面 */
.w{display:inline-flex;flex-direction:column;align-items:center;vertical-align:bottom;margin:0 .1em}
.w .ph{font-size:.5em;line-height:1.25;color:var(--mut);font-weight:400;white-space:nowrap}
.w .ph.zy{font-size:.56em}
.w .hz{line-height:1.45}
.dict{border:0;background:var(--acc2);border-radius:999px;min-height:36px;padding:4px 14px;cursor:pointer;font-size:.9rem;font-family:inherit}
.dictBox{background:#fffaf2;border:1px solid #f3dcc0;border-radius:12px;padding:8px 12px;margin:6px 0;font-size:.95rem}
.dictBox div{margin:3px 0}
.cards{display:flex;gap:10px;justify-content:center;align-items:flex-end;margin:12px 0}
.cards.wrap{flex-wrap:wrap}
.card{flex:1;max-width:170px;background:#fff;border:2px solid #eee;border-radius:14px;padding:6px;cursor:pointer;text-align:center;transition:transform .15s}
.card.full{border:0;background:transparent;padding:0 2px;max-width:120px}
.card:active{transform:scale(.97)}
.card .crop{position:relative;overflow:hidden;border-radius:10px;background:#f3f6fa;margin:0 auto}
.card .crop img{position:absolute;top:0;left:50%;transform:translateX(-50%);display:block;width:auto;max-width:none}
.card.full .fig{display:flex;justify-content:center;align-items:flex-end;border-bottom:3px solid #ccc}
.card.full .fig img{display:block}
.card .lab{margin-top:4px;font-weight:700}
.card .lab:empty{display:none}
.card .tag{display:inline-block;background:#eef3fb;border-radius:8px;padding:1px 7px;font-size:.85rem;margin-top:3px;color:#335}
.card.right{border-color:var(--ok);animation:pop .35s}
.card.wrong{border-color:var(--bad);animation:shake .35s;opacity:.55}
.card.full.right .fig{filter:drop-shadow(0 0 6px #2e9d5b)}
.card.full.wrong{opacity:.4}
.btns{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.btns.row{flex-direction:row}
.ob{min-height:46px;border:2px solid #e3e3e3;background:#fff;border-radius:999px;padding:6px 22px;font-size:1.15rem;cursor:pointer;line-height:1.7;color:var(--ink);font-family:inherit}
.btns.row .ob{flex:1}
.ob.right{border-color:var(--ok);background:#eaf7ef;animation:pop .35s}
.ob.wrong{border-color:var(--bad);background:#fdecec;animation:shake .35s}
.fb{border-radius:12px;padding:10px 12px;margin:8px 0;font-size:1rem}
.fb.ok{background:#eaf7ef}.fb.no{background:#fdecec}
.fb .tr{color:#555;font-size:.92rem;margin-top:4px}
.fb small{display:inline;margin-left:6px}
.score{text-align:center;font-size:3rem;font-weight:800;color:var(--acc);margin:16px 0 0}
.comment{text-align:center;font-size:1.3rem;font-weight:800;color:var(--ok);margin:10px 0 4px}
.passmsg{text-align:center;font-size:1rem;margin:4px 0 8px}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* ⚙️ 設定視窗 */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.ov.hide{display:none}
.setcard{background:#fff;border-radius:20px;padding:14px 12px;width:100%;max-width:420px;max-height:92vh;overflow:auto;box-shadow:0 6px 30px rgba(0,0,0,.15)}
.setcard h2{margin:0 0 10px;text-align:center;font-size:1.3rem}
.setcard h2 small{display:block}
</style>
</head>
<body>
<div id="app"></div>
<div id="setov" class="ov hide"></div>
<script>
// 主題包：預設 people，可用 ?theme=<名稱> 切換（對應 themes/<名稱>.js）；同步載入，引擎執行時一定已就緒
document.write('<script src="themes/'+(new URLSearchParams(location.search).get('theme')||'people').replace(/[^\w-]/g,'')+'.js"><\/script>');
</script>
<script src="engine.js?v=5-4"></script>
<script>
if(!window.THEME_PACK){document.getElementById('app').innerHTML='<p style="padding:20px;text-align:center">找不到主題包 / Theme pack not found</p>';throw new Error('no theme pack');}
const THEME=window.THEME_PACK;
const E=BBK_ENGINE(THEME);          // 出題引擎（engine.js，跟老師管理中心的學習單共用）
const {DIMS,POOL,TN,LV_CNT,passMark,esc}=E;
const app=document.getElementById('app');
const VERSION='v5-4';
const CENTER_URL='https://wangchiapin.github.io/profesor/#/settings';

// ===== 三款遊戲共用的基本設定（⚙️）：localStorage 'hanziGames.settings'，格式見 corre/README.md =====
//   { v:1, script:'trad'|'simp', lang:'es'|'en'|'zh', phon:'pinyin'|'zhuyin'|'both'|'off', rate:'slow'|'normal'|'fast' }
//   比比看沒有語音，所以 ⚙️ 不放語速；寫回時保留別款遊戲的 rate。
const SETTINGS_KEY='hanziGames.settings';
const SET_OPTS={script:['trad','simp'],lang:['es','en','zh'],phon:['pinyin','zhuyin','both','off'],rate:['slow','normal','fast']};
function readSettings(){
  const out={v:1,script:'trad',lang:'es',phon:'pinyin',rate:'normal'};
  let saved=null;
  try{saved=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'null');}catch(e){}
  if(saved&&typeof saved==='object'){
    Object.keys(SET_OPTS).forEach(k=>{if(SET_OPTS[k].includes(saved[k]))out[k]=saved[k];});
  }else{
    // 第一次：從比比看舊的設定搬過來（bbk_cfg：simp、help：es/en/none、py：true/false）
    let old=null;try{old=JSON.parse(localStorage.getItem('bbk_cfg')||'null');}catch(e){}
    if(old&&typeof old==='object'){
      if(old.simp===true)out.script='simp';
      if(old.help==='en')out.lang='en';else if(old.help==='none')out.lang='zh';
      if(old.py===false)out.phon='off';
    }
    writeSettings(out);
  }
  return out;
}
function writeSettings(o){
  try{
    let cur={};try{cur=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')||{};}catch(e){}
    const add={v:1,script:o.script,lang:o.lang,phon:o.phon};
    if(!SET_OPTS.rate.includes(cur.rate))add.rate=o.rate||'normal';   // rate 是跑吧、色數的；有就保留
    localStorage.setItem(SETTINGS_KEY,JSON.stringify(Object.assign(cur,add)));
  }catch(e){}
}
const SET=readSettings();
const simp=()=>SET.script==='simp';
const RO=()=>({simp:simp(),phon:SET.phon});          // 顯示句子用的設定
const zh=s=>E.zh(s,simp());

// ===== 介面文字：[中, 西, 英]；畫面上中文在上、西文或英文小字在下；「只有中文」就只有中文 =====
const U={
 title:['比比看','Compara y Adivina','Compara y Adivina'],
 settings:['設定','Ajustes','Settings'],script:['字形','Escritura','Script'],langLbl:['語言','Idioma','Language'],
 phon:['拼音／注音','Pinyin / Zhuyin','Pinyin / Zhuyin'],pinyin:['拼音','Pinyin','Pinyin'],zhuyin:['注音','Zhuyin','Zhuyin'],
 both:['兩個都顯示','Los dos','Both'],phOff:['關','No','Off'],done:['完成','Listo','Done'],
 choose:['選擇難度','Elige el nivel','Choose a level'],
 l1:['入門','Básico','Basic'],l2:['進階','Intermedio','Intermediate'],l3:['挑戰','Desafío','Challenge'],
 d1:['比、比較、一樣、差不多、不一樣','比, 比較, 一樣, 差不多, 不一樣','比, 比較, 一樣, 差不多, 不一樣'],
 d2:['加上 沒有…那麼、一點、很多、誰比…／…比誰','+ 沒有…那麼, 一點, 很多, 誰比… / …比誰','+ 沒有…那麼, 一點, 很多, 誰比… / …比誰'],
 d3:['加上 更、還、最、具體差距','+ 更, 還, 最, diferencias exactas','+ 更, 還, 最, exact differences'],
 pts:['分','pts','pts'],quit:['離開','Salir','Quit'],
 quitQ:['要離開這一回合嗎？','¿Salir de esta ronda?','Leave this round?'],
 right:['答對了！','¡Correcto!','Correct!'],wrong:['不對，再試一次','No, inténtalo otra vez','Not quite, try again'],
 ans:['正確答案','Respuesta correcta','Correct answer'],next:['下一題','Siguiente','Next'],
 finish:['看結果','Ver resultado','See result'],
 dict:['小字典','Diccionario','Dictionary'],
 res:['回合結束','Fin de la ronda','Round over'],
 clear:['破關了！要繼續下一關嗎？','¡Nivel superado! ¿Pasar al siguiente?','Level cleared! Go to the next level?'],
 allClear:['三關都破了，太厲害了！','¡Superaste los tres niveles!','You cleared all three levels!'],
 tryAgain:['{n} 分以上就破關，再試一次吧！','Con {n} puntos o más superas el nivel. ¡Inténtalo otra vez!','Score {n} or more to clear the level. Try again!'],
 nextLv:['下一關','Siguiente nivel','Next level'],again:['再玩一次','Jugar otra vez','Play again'],menu:['主選單','Menú principal','Main menu'],
 lvName:['第 {n} 關','Nivel {n}','Level {n}'],
 passed:['達標了，做得好！','¡Meta lograda, bien hecho!','Goal reached, well done!'],
 noQ:['這個範圍湊不出題目，請多選一些特徵或題型。','Con este rango no se pueden generar preguntas.','No questions can be made from this range.'],
 tf_t:['對','Verdadero','True'],tf_f:['錯','Falso','False'],
 cm0:['別灰心，再試一次會更好！','¡No te rindas! La próxima vez saldrá mejor.','Don\'t give up! Next time will be better.'],
 cm1:['有進步的空間，加油！','Vas por buen camino, ¡sigue así!','You\'re on your way, keep going!'],
 cm2:['不錯喔，越來越會比了！','¡Bien! Cada vez comparas mejor.','Nice! You\'re getting better at comparing.'],
 cm3:['很棒！差一點就全對了！','¡Muy bien! ¡Casi perfecto!','Great! Almost perfect!'],
 cm4:['全對！太厲害了！','¡Todo correcto! ¡Increíble!','All correct! Amazing!'],
 teacher:['老師管理中心','Centro para profesores','Teacher center'],
 tPractice:['老師指定的練習','Práctica del profesor','Teacher\'s practice'],loading:['載入中…','Cargando…','Loading…'],
 startP:['開始練習','Empezar','Start'],normal:['一般模式（自己選關卡）','Modo normal (elegir nivel)','Normal mode (choose a level)'],
 qn:['題','preguntas','questions'],
 codeMissing:['找不到老師的練習範圍（可能已經刪除），先用一般模式。','No se encontró el rango del profesor (quizá se borró). Usa el modo normal.','The teacher\'s range was not found (maybe deleted). Using normal mode.'],
 codeErr:['老師的練習範圍載入失敗，先用一般模式。','No se pudo cargar el rango del profesor. Usa el modo normal.','Could not load the teacher\'s range. Using normal mode.'],
};
const LI=()=>SET.lang==='en'?2:1;
function u(k){return zh(U[k][0]);}                                        // 只有中文
function fx(k){if(SET.lang==='zh')return '';return U[k][LI()]||'';}       // 外語（只有中文 = 空）
function L(k){const f=fx(k);return esc(u(k))+(f?`<small>${esc(f)}</small>`:'');}   // 中文＋外語小字（兩行）
function Lv(k,v){const a=U[k];const f=SET.lang==='zh'?'':a[LI()].replace('{n}',v);return esc(zh(a[0].replace('{n}',v)))+(f?`<small>${esc(f)}</small>`:'');}

// ===== 老師指定的範圍（鎖定）=====
//   ?r=<範圍碼>：classroom.js 去中心專案 shared_bbk 讀，讀到後呼叫 lockApply；
//   舊格式 ?lv=2&d=height,age&t=pick,tf&n=10：直接在這裡讀，不用連網。
const LK={pending:false,locked:false,name:'',lv:1,dims:[],types:[],n:10,note:''};
const qp=new URLSearchParams(location.search);
const RCODE=(()=>{const r=(qp.get('r')||'').trim().toLowerCase();return /^[a-z0-9]{8,32}$/.test(r)?r:'';})();
const availD=lv=>Object.values(DIMS).filter(d=>d.lv<=lv).map(d=>d.key);
function lockSet(lv,d,t,n){
  LK.lv=lv;
  const dd=availD(lv).filter(k=>(d||[]).includes(k)),tt=POOL[lv].filter(k=>(t||[]).includes(k));   // 照遊戲裡的順序
  LK.dims=dd.length===availD(lv).length?[]:dd;LK.types=tt.length===POOL[lv].length?[]:tt;
  LK.n=Math.max(3,Math.min(30,+n||10));
  if(!E.makeRound(lv,lockRange()).length){LK.dims=[];LK.types=[];}   // 範圍湊不出題目就退回「全部」
  LK.locked=true;}
const lockRange=()=>({lv:LK.lv,dims:LK.dims,types:LK.types,n:LK.n});
if(RCODE){LK.pending=true;LK.locked=true;}
else if(qp.has('lv')&&[1,2,3].includes(+qp.get('lv'))){const lv=+qp.get('lv');
  lockSet(lv,qp.has('d')?qp.get('d').split(','):availD(lv),qp.has('t')?qp.get('t').split(','):POOL[lv],qp.get('n'));}
function lockApply(o){LK.pending=false;const lv=+(o&&o.lv);if(![1,2,3].includes(lv))return lockFail('bad');
  const d=Array.isArray(o.d)&&o.d.length?o.d:availD(lv),t=Array.isArray(o.t)&&o.t.length?o.t:POOL[lv];
  lockSet(lv,d,t,o.n);LK.name=String(o.name||'').slice(0,40);LK.note='';}
function lockFail(why){LK.pending=false;LK.locked=false;LK.name='';LK.note=why==='missing'?'codeMissing':'codeErr';}
function lockExit(){LK.locked=false;LK.name='';LK.note='';try{history.replaceState(null,'',location.href.split('#')[0].split('?')[0]+(CR()&&CR().classMode()?'?class='+CR().classId():''));}catch(e){}renderMenu();}

// ===== 遊戲 =====
const CR=()=>window.CLASSROOM||null;     // classroom.js：班級連結（暱稱、成績回傳）、老師範圍碼
let S=null,screen='menu';
let RANGE=null;   // 這一回合的範圍（null = 一般模式）
function gearBtn(){return `<button class="gear" onclick="openSet()" title="${esc(u('settings'))}" aria-label="${esc(u('settings'))}">⚙️</button>`;}
function renderMenu(){S=null;screen='menu';
  document.title=zh('比比看')+' Compara y Adivina';
  const cm=CR()&&CR().classMode();
  let h=`${gearBtn()}<h1>${esc(u('title'))}</h1><div class="sub">Compara y Adivina</div>`;
  if(cm)h+=CR().bannerHtml();
  if(LK.pending)h+=`<div class="panel"><h3>👩‍🏫 ${L('tPractice')}</h3><div class="note">${L('loading')}</div></div>`;
  else if(LK.locked){
    const dn=(LK.dims.length?LK.dims:availD(LK.lv)).map(k=>zh(DIMS[k].name[0])).join('、');
    const tn=(LK.types.length?LK.types:POOL[LK.lv]).map(k=>zh(TN[k][0])).join('、');
    h+=`<div class="panel"><h3>👩‍🏫 ${L('tPractice')}</h3>${LK.name?`<div style="font-weight:700;margin:2px 0 4px">📐 ${esc(LK.name)}</div>`:''}
      <div style="font-size:.95rem;line-height:1.7">${esc(zh('第 '+LK.lv+' 關'))} · ${LK.n} ${esc(u('qn'))}<br>${esc(dn)}<br>${esc(tn)}</div></div>
      <button class="big" onclick="startRound(${LK.lv},lockRange())">▶ ${L('startP')}</button>
      <button class="big sec" onclick="lockExit()">${L('normal')}</button>`;
  }else{
    if(LK.note)h+=`<div class="panel" style="font-size:.92rem">⚠ ${L(LK.note)}</div>`;
    const nn=SET.lang==='zh'?'':THEME.noun[LI()];
    h+=`<h3 style="margin:16px 0 4px;text-align:center">${L('choose')}</h3>`+[1,2,3].map(n=>`<button class="lvl" onclick="startRound(${n},null)"><b>${n}</b>${esc(u('l'+n))}${fx('l'+n)?`<small>${esc(fx('l'+n))}</small>`:''}<div class="d">${esc(zh(U['d'+n][0]+'｜'+LV_CNT[n]+' '+THEME.noun[0]))}${nn?'<br>'+esc(U['d'+n][LI()]+' · '+LV_CNT[n]+' '+nn):''}</div></button>`).join('');
  }
  if(!cm&&!LK.locked)h+=`<a class="big sec" href="${CENTER_URL}">👩‍🏫 ${L('teacher')}</a>`;
  app.innerHTML=h+`<p class="ver">${VERSION}</p>`;}
function startRound(lv,rg){
  if(CR()&&!CR().canStart())return;          // 班級連結：要先輸入暱稱
  if(rg!==undefined)RANGE=rg;   // 一般關卡傳 null；老師範圍傳範圍；「再玩一次」「下一關」不傳，沿用目前的
  const qs=E.makeRound(lv,RANGE);if(!qs.length){alert(u('noQ'));return;}
  S={lv,qs,i:0,score:0,tries:0,done:false,wrong:[],dict:false,log:[],rg:RANGE};screen='game';renderQ();window.scrollTo(0,0);}
function quit(){const f=fx('quitQ');if(confirm(u('quitQ')+(f?'\n'+f:'')))renderMenu();}
const sentHtml=s=>E.rtS(s.z,RO());
function cardHtml(p,i,q){const name=q.hide&&!S.done?'':esc(p.name);
  return `<div class="card ${q.crop==='full'?'full':''}" data-i="${i}" onclick="pickCard(${i})">${E.cropHtml(p,q,{height:250})}<div class="lab">${name}</div>${E.tagHtml(p,q,simp())}</div>`;}
function dictPh(p){const m=SET.phon==='off'?'pinyin':SET.phon;
  return m==='pinyin'?esc(p):m==='zhuyin'?esc(E.zy(p)):esc(p)+' · '+esc(E.zy(p));}
function renderQ(){const q=S.qs[S.i];const n=S.qs.length;
  let body='';
  if(q.sents)body+=q.sents.map(sentHtml).join('<br>');
  if(q.blankZ){const bh=S.done?`<span class="blank">${esc(zh(q.fillAns))}</span>`:null;body+=E.rtS(q.blankZ,RO(),bh);}
  const qline=`<span class="ask">${E.rt(q.q.z,RO())}</span>`;
  const cards=`<div class="cards ${q.its.length>3&&q.crop!=='full'?'wrap':''}">${q.its.map((p,i)=>cardHtml(p,i,q)).join('')}</div>`;
  let btns='';
  if(q.btns)btns=`<div class="btns ${q.row||q.tf?'row':''}">${q.btns.map((b,i)=>`<button class="ob" data-b="${i}" onclick="pickBtn(${i})">${E.rt(b.z,RO())}${q.tf&&fx(i?'tf_f':'tf_t')?`<small>${esc(fx(i?'tf_f':'tf_t'))}</small>`:''}</button>`).join('')}</div>`;
  const dd=q.d,tr=a=>SET.lang==='zh'?'':' — '+esc(SET.lang==='es'?(Array.isArray(a.es)?a.es.join(' / '):a.es):(Array.isArray(a.en)?a.en[0]:a.en));
  const dl=[dd.pos,dd.neg].filter(Boolean).map(a=>`<div><b style="font-size:1.2rem">${esc(zh(a.z))}</b> ${dictPh(a.p)}${tr(a)}</div>`).join('');
  const poss=dd.poss?`<div><b>${esc(zh(dd.poss.z))}</b> ${dictPh(dd.poss.p)}${tr(dd.poss)}</div>`:'';
  app.innerHTML=`<div class="top"><span class="grow">${esc(zh(U.lvName[0].replace('{n}',S.lv)))} · ${S.i+1} / ${n}</span><span><b>${S.score}</b> ${esc(u('pts'))}</span><button class="pillx" onclick="quit()" title="${esc(u('quit'))}">✕</button>${gearBtn()}</div>
  <div class="bar"><i style="width:${(S.i/n*100).toFixed(0)}%"></i></div>
  <div style="text-align:right"><button class="dict" onclick="S.dict=!S.dict;renderQ()">📖 ${esc(u('dict'))}${fx('dict')?' · '+esc(fx('dict')):''}</button></div>
  ${S.dict?`<div class="dictBox">${poss}${dl}</div>`:''}
  <div class="q">${body}${qline}</div>
  ${cards}${btns}<div id="fb">${S.done?fbHtml():(S.tries?`<div class="fb no"><b>${L('wrong')}</b></div>`:'')}</div>`;
  markState();}
function markState(){const q=S.qs[S.i];
  S.wrong.forEach(k=>{const el=k[0]==='c'?document.querySelector(`.card[data-i="${k.slice(1)}"]`):document.querySelector(`.ob[data-b="${k.slice(1)}"]`);if(el)el.classList.add('wrong');});
  if(S.done){const ci=q.btns?q.btns.findIndex(b=>b.ok):q.its.findIndex(p=>p.id===q.ans);
    const el=q.btns?document.querySelector(`.ob[data-b="${ci}"]`):document.querySelector(`.card[data-i="${ci}"]`);if(el)el.classList.add('right');}}
function fbHtml(){const q=S.qs[S.i];const ok=S.gain>0;let lines=[];
  const add=s=>{const t=E.tr(s,SET.lang);lines.push(`<div>${sentHtml(s)}</div>${t?`<div class="tr">${esc(t)}.</div>`:''}`);};
  if(q.sents)q.sents.forEach(add);
  if(q.full)add(q.full);
  if(q.expl)q.expl.forEach(add);
  if(q.btns&&q.type==='pick')add(q.btns.find(b=>b.ok).tr);
  const qt=E.tr(q.q,SET.lang);
  const last=S.i===S.qs.length-1;
  return `<div class="fb ${ok?'ok':'no'}"><b>${ok?esc(u('right'))+' +'+S.gain:esc(u('ans'))}</b>${ok?(fx('right')?`<small>${esc(fx('right'))}</small>`:''):(fx('ans')?`<small>${esc(fx('ans'))}</small>`:'')}${qt?`<div class="tr">${esc(qt)}</div>`:''}${lines.join('')}</div>
  <button class="big" onclick="nextQ()">${L(last?'finish':'next')}</button>`;}
// 每題作答紀錄（班級連結時會回傳給老師）
function recordAnswer(){const q=S.qs[S.i];if(S.log[S.i])return;
  const r={t:q.type,d:q.d.key,f:q.f||'',p:q.pol||0,ok:S.gain>0,f1:S.gain===10,ids:q.its.map(p=>p.id)};
  if(q.type==='tf')r.tv=!!q.tv;
  S.log[S.i]=r;}
function judge(ok,key){const q=S.qs[S.i];if(S.done)return;
  const nopt=q.btns?q.btns.length:q.its.length;
  if(ok){S.gain=S.tries===0?10:5;S.score+=S.gain;S.done=true;recordAnswer();renderQ();return;}
  S.wrong.push(key);S.tries++;
  if(S.tries>=2||nopt<=2){S.gain=0;S.done=true;recordAnswer();renderQ();return;}
  renderQ();}
function pickCard(i){const q=S.qs[S.i];if(q.btns||S.done||S.wrong.includes('c'+i))return;judge(q.its[i].id===q.ans,'c'+i);}
function pickBtn(i){const q=S.qs[S.i];if(S.done||S.wrong.includes('b'+i))return;judge(q.btns[i].ok,'b'+i);}
function nextQ(){S.i++;S.tries=0;S.done=false;S.wrong=[];S.gain=0;S.dict=false;
  if(S.i>=S.qs.length)return renderResult();renderQ();window.scrollTo(0,0);}
// 五級評語（依得分比例）
function commentKey(sc,max){const p=max?sc/max:0;return p>=1?'cm4':p>=.8?'cm3':p>=.6?'cm2':p>=.4?'cm1':'cm0';}
// 結果畫面：分數 → 評語 → 過關提示 → ✅ 成績已回傳（班級連結）→ 下一關／再玩一次 → 主選單
function renderResult(redraw){screen='result';const sc=S.score,lv=S.lv,max=S.qs.length*10,pass=sc>=passMark(lv,S.qs.length);
  let msg,btn='';
  if(S.rg)msg=pass?L('passed'):Lv('tryAgain',passMark(lv,S.qs.length));   // 老師的範圍：沒有「下一關」
  else if(pass&&lv<3){msg=L('clear');btn=`<button class="big" onclick="startRound(${lv+1})">${L('nextLv')}</button>`;}
  else if(pass)msg=L('allClear');else msg=Lv('tryAgain',passMark(lv,10));
  app.innerHTML=`${gearBtn()}<h1>${esc(u('title'))}</h1><div class="sub">${esc(zh(U.lvName[0].replace('{n}',lv)))} · ${esc(u('res'))}</div>
  <div class="score">${sc}<span style="font-size:1.2rem;color:#999"> / ${max}</span></div>
  <div class="comment">${L(commentKey(sc,max))}</div>
  <div class="passmsg">${msg}</div>
  <div id="clsUp">${CR()?CR().upHtml():''}</div>
  ${btn}<button class="big ${btn?'sec':''}" onclick="startRound(${lv})">${L('again')}</button>
  <button class="big sec" onclick="renderMenu()">${L('menu')}</button>`;
  if(CR()&&!redraw)CR().onResult();}

// ===== ⚙️ 設定視窗（字形／語言／拼音注音；比比看沒有語音，不放語速）=====
function opt(label,on,click){return `<button class="opt ${on?'on':''}" onclick="${click}">${label}</button>`;}
function openSet(){drawSet();document.getElementById('setov').classList.remove('hide');}
function closeSet(){document.getElementById('setov').classList.add('hide');}
function setS(k,v){SET[k]=v;writeSettings(SET);drawSet();rerender();}
function rerender(){if(screen==='game'&&S)renderQ();else if(screen==='result'&&S)renderResult(true);else renderMenu();}
function drawSet(){
  const o=document.getElementById('setov');
  const sm=fx('settings');
  o.innerHTML=`<div class="setcard" onclick="event.stopPropagation()">
    <h2>⚙️ ${esc(u('settings'))}${sm?`<small>${esc(sm)}</small>`:''}</h2>
    <div class="panel"><h3>${L('script')}</h3><div class="opts">
      ${opt('繁體',SET.script==='trad',"setS('script','trad')")}${opt('简体',SET.script==='simp',"setS('script','simp')")}</div></div>
    <div class="panel"><h3>${L('langLbl')}</h3><div class="opts">
      ${opt('中文＋<small>Español</small>',SET.lang==='es',"setS('lang','es')")}${opt('中文＋<small>English</small>',SET.lang==='en',"setS('lang','en')")}${opt('只有中文',SET.lang==='zh',"setS('lang','zh')")}</div></div>
    <div class="panel"><h3>${L('phon')}</h3><div class="opts two">
      ${[['pinyin','pinyin'],['zhuyin','zhuyin'],['both','both'],['off','phOff']].map(([v,k])=>opt(L(k),SET.phon===v,`setS('phon','${v}')`)).join('')}</div></div>
    <button class="big" onclick="closeSet()">${L('done')}</button></div>`;
}
document.getElementById('setov').addEventListener('click',closeSet);   // 點視窗外面也會關
// 別的分頁（跑吧、色數）改了共用設定 → 這裡跟著更新（遊戲進行中先不理）
window.addEventListener('storage',e=>{
  if(e.key!==SETTINGS_KEY||screen==='game')return;
  Object.assign(SET,readSettings());rerender();
});
</script>
<script src="classroom.js?v=6-2"></script>
<script>renderMenu();</script>
