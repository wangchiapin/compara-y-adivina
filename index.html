<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<title>比比看 Compara y Adivina</title>
<style>
:root{--acc:#ff7a59;--acc2:#ffe8e0;--ink:#222;--mut:#777;--ok:#2e9d5b;--bad:#e0464b;--bg:#fff;--panel:#f6f6f7}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
#app{max-width:520px;margin:0 auto;padding:14px 16px 40px}
h1{text-align:center;margin:10px 0 0;font-size:2rem;letter-spacing:.1em}
.sub{text-align:center;color:var(--mut);margin-bottom:14px}
small,.fo{display:block;font-size:.72em;color:var(--mut);font-weight:400}
.panel{background:var(--panel);border-radius:14px;padding:12px 14px;margin:10px 0}
.panel h3{margin:0 0 8px;font-size:1rem}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opt{flex:1;min-width:80px;border:2px solid #ddd;background:#fff;border-radius:12px;padding:9px 6px;font-size:1rem;cursor:pointer;text-align:center;color:var(--ink)}
.opt.on{border-color:var(--acc);background:var(--acc2);font-weight:700}
.lvl{display:block;width:100%;text-align:left;border:2px solid #eee;background:#fff;border-radius:14px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:1.05rem;color:var(--ink)}
.lvl b{color:var(--acc);margin-right:6px}
.lvl .d{font-size:.85rem;color:var(--mut);margin-top:4px}
.big{display:block;width:100%;border:0;border-radius:14px;padding:13px;font-size:1.15rem;background:var(--acc);color:#fff;cursor:pointer;margin:10px 0;font-weight:700}
.big.sec{background:#eee;color:var(--ink)}
.big small{color:inherit;opacity:.8}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.95rem}
.top .x{border:0;background:#eee;border-radius:10px;padding:6px 10px;cursor:pointer;font-size:.95rem}
.bar{height:6px;background:#eee;border-radius:3px;margin:8px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.q{font-size:1.35rem;line-height:1.9;margin:12px 0 6px;text-align:center}
.q .nm{color:#2a5bd7;font-weight:700;margin:0 .15em}
.q .blank{display:inline-block;min-width:2.6em;border-bottom:3px solid var(--acc);margin:0 .2em;color:var(--acc);font-weight:700}
.q .ask{display:block;font-weight:700;margin-top:4px}
ruby rt{font-size:.5em;color:var(--mut);font-weight:400}
.dict{border:0;background:var(--acc2);border-radius:10px;padding:4px 10px;cursor:pointer;font-size:.9rem}
.dictBox{background:#fffaf2;border:1px solid #f3dcc0;border-radius:12px;padding:8px 12px;margin:6px 0;font-size:.95rem}
.dictBox div{margin:3px 0}
.cards{display:flex;gap:10px;justify-content:center;align-items:flex-end;margin:12px 0}
.cards.wrap{flex-wrap:wrap}
.card{flex:1;max-width:170px;background:#fff;border:2px solid #eee;border-radius:14px;padding:6px;cursor:pointer;text-align:center;transition:transform .15s}
.card.full{border:0;background:transparent;padding:0 2px;max-width:120px}
.card:active{transform:scale(.97)}
.card .crop{position:relative;overflow:hidden;border-radius:10px;background:#f3f6fa;margin:0 auto}
.card .crop img{position:absolute;top:0;left:50%;transform:translateX(-50%);display:block;width:auto;max-width:none}
.fb .nm,.ob .nm{color:#2a5bd7;font-weight:700;margin:0 .15em}
.card.full .fig{display:flex;justify-content:center;align-items:flex-end;border-bottom:3px solid #ccc}
.card.full .fig img{display:block}
.card .lab{margin-top:4px;font-weight:700}
.card .lab:empty{display:none}
.card .tag{display:inline-block;background:#eef3fb;border-radius:8px;padding:1px 7px;font-size:.85rem;margin-top:3px;color:#335}
.card.right{border-color:var(--ok);animation:pop .35s}
.card.wrong{border-color:var(--bad);animation:shake .35s;opacity:.55}
.card.full.right .fig{filter:drop-shadow(0 0 6px #2e9d5b)}
.card.full.wrong{opacity:.4}
.ground{height:3px;background:#ccc;border-radius:2px;margin:-12px 0 12px}
.btns{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.btns.row{flex-direction:row}
.ob{border:2px solid #e3e3e3;background:#fff;border-radius:12px;padding:10px;font-size:1.15rem;cursor:pointer;line-height:1.8;color:var(--ink)}
.btns.row .ob{flex:1}
.ob.right{border-color:var(--ok);background:#eaf7ef;animation:pop .35s}
.ob.wrong{border-color:var(--bad);background:#fdecec;animation:shake .35s}
.fb{border-radius:12px;padding:10px 12px;margin:8px 0;font-size:1rem}
.fb.ok{background:#eaf7ef}.fb.no{background:#fdecec}
.fb .tr{color:#555;font-size:.92rem;margin-top:4px}
.score{text-align:center;font-size:3rem;font-weight:800;color:var(--acc);margin:16px 0 0}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.note{color:var(--mut);font-size:.85rem;text-align:center}
</style>

function trOf(o){if(cfg.help==='none'||!o)return '';return cfg.help==='es'?o.es:o.en;}
function cardHtml(p,i,q){const name=q.hide&&!S.done?'':esc(p.name);let tag='';
  if(q.tag==='age')tag=`<div class="tag">${p.age} ${esc(zh('歲'))}</div>`;
  if(q.tagCm)tag=`<div class="tag">${p.h} cm</div>`;
  if(q.crop==='full'){const maxH=Math.max(...q.ppl.map(x=>x.h));const H=Math.round(250*p.h/maxH);const w=Math.round(p.w*H/p.ih);
    return `<div class="card full" data-i="${i}" onclick="pickCard(${i})"><div class="fig" style="height:250px"><img src="img/${p.id}.webp" alt="" style="height:${H}px;width:${w}px"></div><div class="lab">${name}</div>${tag}</div>`;}
  const fr=q.crop==='face'?p.face*1.15:0.52;const ar=q.crop==='face'?1:0.78;
  return `<div class="card" data-i="${i}" onclick="pickCard(${i})"><div class="crop" style="aspect-ratio:${ar};width:100%"><img src="img/${p.id}.webp" alt="" style="height:${(100/fr).toFixed(1)}%"></div><div class="lab">${name}</div>${tag}</div>`;}
// ===== 遊戲狀態 =====
let S=null;
function renderMenu(){S=null;
  app.innerHTML=`<h1>${esc(u('title'))}</h1><div class="sub">Compara y Adivina</div>
  <div class="panel"><h3>${L('script')}</h3><div class="opts">
    <button class="opt ${!cfg.simp?'on':''}" onclick="setC('simp',false)">繁體</button><button class="opt ${cfg.simp?'on':''}" onclick="setC('simp',true)">简体</button></div></div>
  <div class="panel"><h3>${L('help')}</h3><div class="opts">
    <button class="opt ${cfg.help==='es'?'on':''}" onclick="setC('help','es')">Español</button><button class="opt ${cfg.help==='en'?'on':''}" onclick="setC('help','en')">English</button><button class="opt ${cfg.help==='none'?'on':''}" onclick="setC('help','none')">${esc(u('none'))}</button></div></div>
  <div class="panel"><h3>${L('py')}</h3><div class="opts">
    <button class="opt ${!cfg.py?'on':''}" onclick="setC('py',false)">${L('off')}</button><button class="opt ${cfg.py?'on':''}" onclick="setC('py',true)">${L('on')}</button></div></div>
  <h3 style="margin:16px 0 4px">${L('choose')}</h3>
  ${[1,2,3].map(n=>`<button class="lvl" onclick="startRound(${n})"><b>${n}</b>${esc(u('l'+n))}${fo('l'+n)}<div class="d">${esc(zh(U['d'+n][0]))}${cfg.help!=='none'?'<br>'+esc(U['d'+n][cfg.help==='es'?1:2]):''}</div></button>`).join('')}`;}
function setC(k,v){cfg[k]=v;saveCfg();if(S)renderQ();else renderMenu();}
function startRound(lv){S={lv,qs:makeRound(lv),i:0,score:0,tries:0,done:false,wrong:[],dict:false};renderQ();window.scrollTo(0,0);}
function quit(){if(confirm(u('quitQ')))renderMenu();}
function renderQ(){const q=S.qs[S.i];const n=S.qs.length;
  let body='';
  if(q.sents)body+=q.sents.map(s=>rt(s.z)+esc(zh('。'))).join('<br>');
  if(q.blankZ){const bh=S.done?`<span class="blank">${esc(zh(q.fillAns))}</span>`:null;body+=rt(q.blankZ,bh)+esc(zh('。'));}
  const qline=`<span class="ask">${rt(q.q.z)}</span>`;
  const cards=`<div class="cards ${q.ppl.length>3&&q.crop!=='full'?'wrap':''}">${q.ppl.map((p,i)=>cardHtml(p,i,q)).join('')}</div>`;
  let btns='';
  if(q.btns)btns=`<div class="btns ${q.row||q.tf?'row':''}">${q.btns.map((b,i)=>`<button class="ob" data-b="${i}" onclick="pickBtn(${i})">${rt(b.z)}${q.tf&&cfg.help!=='none'?`<small>${esc(U[i?'tf_f':'tf_t'][cfg.help==='es'?1:2])}</small>`:''}</button>`).join('')}</div>`;
  const dd=q.d,dl=[dd.pos,dd.neg].filter(Boolean).map(a=>`<div><b style="font-size:1.2rem">${esc(zh(a.z))}</b> ${esc(a.p)}${cfg.help!=='none'?' — '+esc(cfg.help==='es'?(Array.isArray(a.es)?a.es.join(' / '):a.es):a.en[0]):''}</div>`).join('');
  const poss=dd.poss?`<div><b>${esc(zh(dd.poss.z))}</b> ${esc(dd.poss.p)}${cfg.help!=='none'?' — '+esc(cfg.help==='es'?dd.poss.es:dd.poss.en):''}</div>`:'';
  app.innerHTML=`<div class="top"><span>${esc(zh(U.lvName[0].replace('{n}',S.lv)))} · ${S.i+1} / ${n}</span><span><b>${S.score}</b> ${esc(u('pts'))}</span><button class="x" onclick="quit()">✕</button></div>
  <div class="bar"><i style="width:${(S.i/n*100).toFixed(0)}%"></i></div>
  <div style="text-align:right"><button class="dict" onclick="S.dict=!S.dict;renderQ()">📖 ${esc(u('dict'))}</button></div>
  ${S.dict?`<div class="dictBox">${poss}${dl}</div>`:''}
  <div class="q">${body}${qline}</div>
  ${q.btns&&!q.tf&&!q.row?'':''}
  ${cards}${btns}<div id="fb">${S.done?fbHtml():''}</div>`;
  markState();}
function markState(){const q=S.qs[S.i];
  S.wrong.forEach(k=>{const el=k[0]==='c'?document.querySelector(`.card[data-i="${k.slice(1)}"]`):document.querySelector(`.ob[data-b="${k.slice(1)}"]`);if(el)el.classList.add('wrong');});
  if(S.done){const ci=q.btns?q.btns.findIndex(b=>b.ok):q.ppl.findIndex(p=>p.id===q.ans);
    const el=q.btns?document.querySelector(`.ob[data-b="${ci}"]`):document.querySelector(`.card[data-i="${ci}"]`);if(el)el.classList.add('right');}}
function fbHtml(){const q=S.qs[S.i];const ok=S.gain>0;let lines=[];
  const add=(s)=>lines.push(`<div>${rt(s.z)}${esc(zh('。'))}</div>${trOf(s)?`<div class="tr">${esc(trOf(s))}.</div>`:''}`);
  if(q.sents)q.sents.forEach(add);
  if(q.full)add(q.full);
  if(q.expl)q.expl.forEach(add);
  if(q.btns&&q.type==='pick'){const t=q.btns.find(b=>b.ok);add(t.tr);}
  if(q.tf&&q.sents){}
  const qt=trOf(q.q);
  const last=S.i===S.qs.length-1;
  return `<div class="fb ${ok?'ok':'no'}"><b>${ok?esc(u('right'))+' +'+S.gain:esc(u('ans'))}</b>${qt?`<div class="tr">${esc(qt)}</div>`:''}${lines.join('')}</div>
  <button class="big" onclick="nextQ()">${L(last?'finish':'next')}</button>`;}
function judge(ok,key){const q=S.qs[S.i];if(S.done)return;
  const nopt=q.btns?q.btns.length:q.ppl.length;
  if(ok){S.gain=S.tries===0?10:5;S.score+=S.gain;S.done=true;renderQ();return;}
  S.wrong.push(key);S.tries++;
  if(S.tries>=2||nopt<=2){S.gain=0;S.done=true;renderQ();return;}
  renderQ();const fb=document.getElementById('fb');fb.innerHTML=`<div class="fb no"><b>${esc(u('wrong'))}</b>${fo('wrong')}</div>`;}
function pickCard(i){const q=S.qs[S.i];if(q.btns||S.done||S.wrong.includes('c'+i))return;judge(q.ppl[i].id===q.ans,'c'+i);}
function pickBtn(i){const q=S.qs[S.i];if(S.done||S.wrong.includes('b'+i))return;judge(q.btns[i].ok,'b'+i);}
function nextQ(){S.i++;S.tries=0;S.done=false;S.wrong=[];S.gain=0;S.dict=false;
  if(S.i>=S.qs.length)return renderResult();renderQ();window.scrollTo(0,0);}
function renderResult(){const sc=S.score,lv=S.lv,pass=sc>=60;
  let msg,btn='';
  if(pass&&lv<3){msg=L('clear');btn=`<button class="big" onclick="startRound(${lv+1})">${L('nextLv')}</button>`;}
  else if(pass)msg=L('allClear');else msg=L('tryAgain');
  app.innerHTML=`<h1>${esc(u('title'))}</h1><div class="sub">${esc(zh(U.lvName[0].replace('{n}',lv)))} · ${L('res')}</div>
  <div class="score">${sc}<span style="font-size:1.2rem;color:#999"> / ${S.qs.length*10}</span></div>
  <p style="text-align:center;font-size:1.1rem">${msg}</p>
  ${btn}<button class="big ${btn?'sec':''}" onclick="startRound(${lv})">${L('again')}</button>
  <button class="big sec" onclick="renderMenu()">${L('menu')}</button>`;}
renderMenu();
</script>
</body>
</html>
